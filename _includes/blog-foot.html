<script>
document.getElementById('theme').addEventListener('click', function(){
  var r = document.documentElement;
  r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('theme', r.dataset.theme); } catch(e) {}
});
</script>
